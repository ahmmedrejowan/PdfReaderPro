name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    # A normal run takes 12-15 minutes. Without a limit a hung build runs for
    # GitHub's 6 hours; the step limits below fail it sooner.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Each step runs Gradle in a fresh JVM. A daemon shared by lint, tests and
      # the APK build carries their memory into packaging, where builds hung.
      # The watchdog prints Gradle's threads 3 minutes before a step's limit, the
      # last moment a hung build can still be inspected.
      - name: Run Lint
        timeout-minutes: 20
        run: chmod +x gradlew && .github/scripts/gradle-watchdog.sh 17 :app:lint --no-daemon

      - name: Run Unit Tests
        timeout-minutes: 20
        run: .github/scripts/gradle-watchdog.sh 17 :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        timeout-minutes: 15
        run: .github/scripts/gradle-watchdog.sh 12 :app:assembleDebug --no-daemon

      - name: Upload Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
