name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    # A normal run takes 12-15 minutes. Without a limit a hung build runs for
    # GitHub's 6 hours; the step limits below fail it sooner.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run Lint
        timeout-minutes: 20
        run: chmod +x gradlew && ./gradlew :app:lint

      - name: Run Unit Tests
        timeout-minutes: 20
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Debug APK
        timeout-minutes: 15
        run: ./gradlew :app:assembleDebug

      # A step that times out counts as failed, so this runs and records where a
      # hung build was stuck: every thread of the Gradle processes and their heap.
      - name: Dump Gradle state
        if: failure()
        run: |
          jps -lv || true
          for pid in $(jps -q); do
            echo "===== $pid ====="
            jcmd "$pid" GC.heap_info || true
            jcmd "$pid" Thread.print || true
          done

      - name: Upload Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
