name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type. The version and notes come from the newest entry in CHANGELOG.md.'
        required: true
        default: 'Full release'
        type: choice
        options:
          - Full release
          - Pre-release

permissions:
  contents: write

jobs:
  # Step 1: Read the version and its notes from CHANGELOG.md
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      apk_name: ${{ steps.changelog.outputs.apk_name }}
      notes: ${{ steps.changelog.outputs.notes }}
      skip: ${{ steps.tag.outputs.skip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version and notes from CHANGELOG.md
        id: changelog
        run: python3 .github/scripts/changelog_release.py CHANGELOG.md >> "$GITHUB_OUTPUT"

      # The APK reports versionName as its version. A release whose APK says
      # something else keeps offering itself as an update, so both must agree.
      - name: Check the app version matches the changelog
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          APP_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "::error file=app/build.gradle.kts::versionName is '$APP_VERSION' but the newest CHANGELOG.md entry is '$VERSION'. Update both in the docs commit."
            exit 1
          fi
          echo "versionName and CHANGELOG.md both say $VERSION"

      # A published release with its APK means the work is done. A tag on its own
      # is left over from an interrupted run, and skipping on it would block the
      # release for good, so that stops with instructions instead.
      - name: Check if this version is already released
        id: tag
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          APK_NAME: ${{ steps.changelog.outputs.apk_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=$(gh release view "v$VERSION" --json isDraft,assets \
            --jq 'select(.isDraft | not) | .assets[].name' 2>/dev/null || true)
          if printf '%s\n' "$ASSETS" | grep -qx "$APK_NAME"; then
            echo "::notice::v$VERSION is already released, nothing to do. Add a new version to CHANGELOG.md to release again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION exists but has no published release with $APK_NAME. Delete the tag (git push --delete origin v$VERSION) and any draft release, then run again."
            exit 1
          else
            echo "Releasing v$VERSION ($RELEASE_TYPE)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # Step 2: Run unit tests, lint, and build in parallel
  unit-test:
    name: Unit Tests
    needs: validate
    if: needs.validate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # A hung Gradle build fails here instead of running to GitHub's 6-hour limit.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run Unit Tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --no-daemon

  lint:
    name: Lint
    needs: validate
    if: needs.validate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # A hung Gradle build fails here instead of running to GitHub's 6-hour limit.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run Lint
        run: chmod +x gradlew && ./gradlew :app:lintRelease --no-daemon

  build:
    name: Build APK
    needs: validate
    if: needs.validate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # A hung Gradle build fails here instead of running to GitHub's 6-hour limit.
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      APK_NAME: ${{ needs.validate.outputs.apk_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare APK
        id: apk
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/${{ env.APK_NAME }}
          cd app/build/outputs/apk/release
          sha256sum ${{ env.APK_NAME }} > ${{ env.APK_NAME }}.sha256
          md5sum ${{ env.APK_NAME }} > ${{ env.APK_NAME }}.md5
          SIZE=$(du -h ${{ env.APK_NAME }} | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/${{ env.APK_NAME }}
            app/build/outputs/apk/release/${{ env.APK_NAME }}.sha256
            app/build/outputs/apk/release/${{ env.APK_NAME }}.md5
          retention-days: 90

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/release.keystore

    outputs:
      apk_size: ${{ steps.apk.outputs.size }}

  # Step 3: Create release only if all checks pass
  release:
    name: Create Release
    needs: [validate, unit-test, lint, build]
    if: needs.validate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      APK_NAME: ${{ needs.validate.outputs.apk_name }}
      APK_SIZE: ${{ needs.build.outputs.apk_size }}

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PDF Reader Pro v${{ env.VERSION }}
          body: |
            ## What's New

            ${{ needs.validate.outputs.notes }}

            ## Download

            | File | Size |
            |------|------|
            | `${{ env.APK_NAME }}` | ${{ env.APK_SIZE }} |

            ## Installation

            1. Download `${{ env.APK_NAME }}` below
            2. Enable "Install from unknown sources" if prompted
            3. Open the APK to install

            ## Verify Download (Optional)

            ```bash
            sha256sum -c ${{ env.APK_NAME }}.sha256
            md5sum -c ${{ env.APK_NAME }}.md5
            ```

            ---

            **Full Changelog:** [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/CHANGELOG.md)
          files: |
            ./release/${{ env.APK_NAME }}
            ./release/${{ env.APK_NAME }}.sha256
            ./release/${{ env.APK_NAME }}.md5
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'Pre-release' }}
          make_latest: ${{ github.event.inputs.release_type == 'Full release' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
